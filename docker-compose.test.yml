services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: blueplm
      MARIADB_USER: blueplm
      MARIADB_PASSWORD: blueplm-test-password
      MARIADB_ROOT_PASSWORD: root-test-password
    healthcheck:
      # The entrypoint's temporary Unix-socket server accepts localhost before
      # it creates the application account, then shuts down.  Probe TCP so
      # depends_on releases the API only after the final server is listening.
      test: ["CMD", "mariadb-admin", "ping", "--protocol=tcp", "-h", "127.0.0.1", "-uroot", "-proot-test-password"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      MARIADB_HOST: mariadb
      MARIADB_PORT: 3306
      MARIADB_DATABASE: blueplm
      MARIADB_USER: blueplm
      MARIADB_PASSWORD: blueplm-test-password
      BLUEPLM_SESSION_SECRET: test-session-secret-must-be-at-least-thirty-two-characters
      BLUEPLM_BOOTSTRAP_TOKEN: integration-bootstrap-token-must-be-at-least-32-chars
      BLUEPLM_MAINTENANCE_TOKEN: integration-maintenance-token-must-be-at-least-32-chars
      BLUEPLM_INSTALLATION_TOKEN: integration-installation-token-must-be-at-least-32-chars
      BLUEPLM_CORS_ORIGINS: null,file://,http://localhost:5173
    ports:
      - "18080:80"
    depends_on:
      mariadb:
        condition: service_healthy
